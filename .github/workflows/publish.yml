name: publish

on:
  push:
    tags: ["v*"]

jobs:
  # Rebuild wheels + sdist for the tag, then publish to PyPI via Trusted
  # Publishing (OIDC). No API token is stored in the repository.
  call-wheels:
    uses: ./.github/workflows/wheels.yml

  publish-pypi:
    name: Publish to PyPI
    needs: call-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyqes
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
      actions: read    # download-artifact@v4+
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "wheels-*"
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
