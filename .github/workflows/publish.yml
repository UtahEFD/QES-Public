name: publish

on:
  push:
    tags: ["v*"]

jobs:
  # Rebuild CPU wheels + sdist + Linux CUDA wheel for the tag, then publish
  # to PyPI via Trusted Publishing (OIDC). No API token is stored in the repo.
  call-wheels:
    uses: ./.github/workflows/wheels.yml

  call-cuda-build:
    uses: ./.github/workflows/cuda-build.yml

  publish-pypi:
    name: Publish to PyPI
    needs: [call-wheels, call-cuda-build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyqes
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
      actions: read    # download-artifact@v4+
    steps:
      # Includes CPU wheels (wheels-ubuntu-latest, …) and wheels-linux-cuda.
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "wheels-*"
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
          merge-multiple: true

      - name: List packages to publish
        run: ls -la dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
