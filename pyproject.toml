[build-system]
requires = ["scikit-build-core>=1.0", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "pyqes"
version = "2.3.1"
description = "Python wrapper for the Quick Environmental Simulation (QES) suite: QES-Winds, QES-Plume and QES-Fire."
# Embedded into wheel/sdist METADATA → shown on PyPI as the project description.
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "QES / TIPEE" }]
keywords = ["QES", "CFD", "wind", "dispersion", "fire", "urban", "microclimate"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "pydantic>=2",
    "numpy",
]

[project.optional-dependencies]
# Geospatial preprocessing (DEM origin, domain cells, buildings clipping).
geo = ["rasterio", "pyproj", "geopandas"]
# NetCDF post-processing helpers.
io = ["netCDF4"]

[project.urls]
Homepage = "https://github.com/UtahEFD"
Documentation = "https://qes-documentation.readthedocs.io/en/latest"

# ----------------------------------------------------------
# scikit-build-core: build the pybind11 extensions via CMake
# ----------------------------------------------------------
[tool.scikit-build]
minimum-version = "1.0"
cmake.version = ">=3.18"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/pyQES"]
# Opt-in SDist contents only (requires scikit-build-core >= 1.0).
# README.md must be listed so project.readme resolves when rebuilding from the
# tarball; its text is also embedded in PKG-INFO / wheel METADATA for PyPI.
sdist.inclusion-mode = "explicit"
sdist.include = [
    "src/util/**",
    "src/winds/**",
    "src/plume/**",
    "src/fire/**",
    "src/bindings/**",
    "src/pyQES/**",
    "cmake/**",
    "CMakeLists.txt",
    "README.md",
    "LICENSE",
    "vcpkg.json",
    "pyproject.toml",
]
sdist.exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.so",
    "**/*.dylib",
    "**/*.dll",
]

[tool.scikit-build.cmake.define]
QES_BUILD_PYTHON = "ON"
ENABLE_TESTS = "OFF"

# ----------------------------------------------------------
# uv / dev tooling
# ----------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
    "rasterio",
    "pyproj",
    "geopandas",
    "netCDF4",
]

[tool.uv]
# Rebuild the extension when local C++/CMake sources change during development.
reinstall-package = ["pyqes"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "slow: end-to-end runs that require the compiled native extension",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["pyQES"]
mypy_path = "src"
ignore_missing_imports = true
